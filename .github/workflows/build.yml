name: IIBKAAB POS Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js (Haddii PWA yahay)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build App Directory
        run: |
          mkdir -p output_app
          echo "Dhismaha IIBKAAB POS wuu socdaa..."
          # Halkan waxaa la gelin karaa koodhka dhismaha ee rasmiga ah haddii uu jiro

      - name: Upload APK ama Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Iibkaab-POS-App
          path: .
          
